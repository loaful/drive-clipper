<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drive Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-shell" data-app="popup">
      <header class="popup-header">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="currentColor" class="brand-bg" />
            <path d="M7 5.5h6.5L17 9v9.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1Z" fill="#ffffff" />
            <path d="M13.5 5.5V8a1 1 0 0 0 1 1H17l-3.5-3.5Z" fill="#bfdbfe" />
            <rect x="8.2" y="11" width="5.6" height="1.5" rx="0.75" fill="#2563eb" />
            <rect x="8.2" y="14" width="6.8" height="1.5" rx="0.75" fill="#94a3b8" />
          </svg>
          <span class="brand-title">Drive Clipper</span>
        </div>
        <div class="header-actions">
          <span id="auth-pill" class="status-pill status-pill--neutral" data-status="loading">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="auth-pill-label">Checking...</span>
          </span>
          <button
            type="button"
            id="open-options-header-btn"
            class="icon-btn"
            title="Open settings"
            aria-label="Open settings"
          >
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <circle cx="10" cy="10" r="2.75" />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10 2.75v1.5m0 11.5v1.5m7.25-7.25h-1.5m-11.5 0h-1.5m12.37-5.12-1.06 1.06M5.94 14.06l-1.06 1.06m10.24 0-1.06-1.06M5.94 5.94 4.88 4.88"
              />
            </svg>
          </button>
        </div>
      </header>

      <section id="onboarding-banner" class="banner" hidden aria-live="polite">
        <div class="banner-body">
          <p id="banner-title" class="banner-title"></p>
          <p id="banner-description" class="banner-description"></p>
        </div>
        <div class="banner-actions">
          <button type="button" id="banner-signin-btn" class="btn btn--secondary btn--sm" hidden>
            Sign in with Google
          </button>
          <button type="button" id="banner-options-btn" class="btn btn--ghost btn--sm">
            Open Options
          </button>
        </div>
      </section>

      <form id="clip-form" class="clip-form" novalidate>
        <div class="field">
          <label for="title-input" class="field-label">Title</label>
          <input
            id="title-input"
            name="title"
            type="text"
            class="text-input"
            placeholder="Page title"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="folder-preview-row" class="folder-preview-row" title="Google Drive path created for this clip">
            <svg class="folder-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <path d="M2 4.25A1.25 1.25 0 0 1 3.25 3h2.8l1.2 1.5h5.5A1.25 1.25 0 0 1 14 5.75v6A1.25 1.25 0 0 1 12.75 13h-9.5A1.25 1.25 0 0 1 2 11.75v-7.5Z" />
            </svg>
            <span id="root-folder-prefix" class="folder-prefix">WebClips/</span>
            <code id="folder-preview" class="folder-slug" data-testid="folder-preview"></code>
          </div>
        </div>

        <div class="field">
          <div class="field-label-row">
            <span class="field-label">Clip scope</span>
            <span id="selection-hint" class="field-meta"></span>
          </div>
          <div class="segmented" role="radiogroup" aria-label="Clip mode">
            <button
              type="button"
              id="mode-full-btn"
              class="segmented-btn"
              role="radio"
              aria-checked="true"
              data-mode="full"
            >
              Full page
            </button>
            <button
              type="button"
              id="mode-selection-btn"
              class="segmented-btn"
              role="radio"
              aria-checked="false"
              data-mode="selection"
            >
              Selection
            </button>
          </div>
        </div>

        <div class="field">
          <label for="tags-input" class="field-label">Tags</label>
          <div id="tags-container" class="tag-input-box">
            <input
              id="tags-input"
              type="text"
              class="tag-text-input"
              placeholder="Add tags (comma or Enter)..."
              autocomplete="off"
              spellcheck="false"
            />
          </div>
        </div>

        <button type="submit" id="clip-submit-btn" class="btn btn--primary btn--full">
          <span id="clip-btn-spinner" class="spinner" hidden aria-hidden="true"></span>
          <span id="clip-btn-label">Clip to Google Drive</span>
        </button>
        <p id="clip-submit-hint" class="submit-hint" hidden aria-live="polite"></p>
      </form>

      <section id="submit-error-panel" class="submit-error-panel" hidden role="alert">
        <div class="submit-error-content">
          <p id="submit-error-title" class="submit-error-title"></p>
          <p id="submit-error-message" class="submit-error-message"></p>
        </div>
        <button
          type="button"
          id="submit-error-dismiss-btn"
          class="queue-dismiss-btn"
          aria-label="Dismiss error"
          title="Dismiss"
        >
          ×
        </button>
      </section>

      <section
        id="clip-queue-panel"
        class="queue-panel"
        hidden
        aria-live="polite"
        aria-label="Clip queue"
      >
        <div class="queue-header">
          <div class="queue-heading-group">
            <h2 class="queue-title">Clip queue</h2>
            <span
              id="clip-queue-summary"
              class="queue-summary-badge"
              data-testid="clip-queue-summary"
            ></span>
          </div>
          <button
            type="button"
            id="clear-done-jobs-btn"
            class="queue-clear-btn"
            hidden
          >
            Clear done
          </button>
        </div>
        <ul id="clip-queue-list" class="queue-list" data-testid="clip-queue-list"></ul>
      </section>

      <details id="recent-clips-section" class="recent-clips">
        <summary class="recent-clips-summary">
          <span class="recent-clips-heading">
            <svg class="chevron" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m6 4 4 4-4 4" />
            </svg>
            <span>Recent clips</span>
          </span>
          <span id="recent-clips-count" class="count-badge">0</span>
        </summary>
        <div id="recent-clips-body" class="recent-clips-body">
          <p id="recent-clips-empty" class="recent-clips-empty">No clips saved yet.</p>
          <ul id="recent-clips-list" class="recent-clips-list" hidden></ul>
        </div>
      </details>
    </div>

    <script src="popup.js" defer></script>
  </body>
</html>
